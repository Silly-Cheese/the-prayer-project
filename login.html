<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Login | The Prayer Project</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#06101f,#0b1730 45%,#050914);font-family:Inter,sans-serif;color:#f8fafc}.card{width:min(460px,calc(100% - 32px));padding:34px;border-radius:28px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}h1{margin-top:0;font-size:42px}p{color:#cbd5e1;line-height:1.8}label{display:grid;gap:8px;margin-top:16px;font-weight:700;color:#cbd5e1}input{border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.24);color:#fff;border-radius:16px;padding:14px;font:inherit}.btn{margin-top:20px;width:100%;border:0;border-radius:999px;padding:14px;font-weight:800;background:#e7c873;color:#07111f;cursor:pointer}.notice{margin-top:16px;color:#fecaca}</style></head><body><main class="card"><h1>Admin Login</h1><p>Authorized administrators can sign in below to access moderation and platform controls.</p><label>Email<input id="email" type="email" placeholder="admin@example.com"></label><label>Password<input id="password" type="password" placeholder="Password"></label><button class="btn" id="loginBtn">Sign In</button><div id="notice" class="notice"></div></main><script type="module" src="./auth.js"></script></body></html>
