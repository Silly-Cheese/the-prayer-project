<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Settings | Admin</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./theme.css"><link rel="stylesheet" href="./admin-shared.css"><style>.status-editor-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.status-editor{padding:18px;border-radius:22px;background:rgba(255,255,255,.045);border:1px solid rgba(216,195,165,.14)}.status-editor h3{margin:0 0 12px}.status-editor .setting-row{margin:10px 0}@media(max-width:850px){.status-editor-grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><div class="shell nav-inner"><a class="brand" href="admin.html"><div class="brand-mark">✦</div><div class="brand-title">The Prayer Project<span>Settings</span></div></a><div class="nav-links"></div></div></nav><main class="admin-shell"><section class="admin-page-hero"><div class="eyebrow">Admin</div><h1>Site Settings</h1><p class="lead">Change the daily verse, homepage announcement, and live site status.</p></section><section class="admin-layout"><aside class="admin-sidebar" data-admin-nav></aside><section class="admin-content"><div class="card admin-card"><h2>Public Site Status</h2><p class="small">Set a specific status and message for each public service card.</p><div class="status-editor-grid"><div class="status-editor"><h3>Prayer Submissions</h3><div class="setting-row"><label>Submissions</label><select id="submissionsOpen"><option value="true">Open</option><option value="false">Closed</option></select></div><div class="setting-row"><label>Status</label><select id="submissionsStatus"><option value="online">Online</option><option value="limited">Limited</option><option value="maintenance">Maintenance</option><option value="offline">Offline</option></select></div><div class="setting-row"><label>Message</label><textarea id="submissionsMessage" rows="3" placeholder="Prayer request submissions are currently open."></textarea></div></div><div class="status-editor"><h3>Prayer Wall</h3><div class="setting-row"><label>Status</label><select id="wallStatus"><option value="online">Online</option><option value="limited">Limited</option><option value="maintenance">Maintenance</option><option value="offline">Offline</option></select></div><div class="setting-row"><label>Message</label><textarea id="wallMessage" rows="3" placeholder="The public prayer wall is loading approved requests."></textarea></div></div><div class="status-editor"><h3>Email Service</h3><div class="setting-row"><label>Status</label><select id="emailStatus"><option value="online">Online</option><option value="limited">Limited</option><option value="maintenance">Maintenance</option><option value="offline">Offline</option></select></div><div class="setting-row"><label>Message</label><textarea id="emailMessage" rows="3" placeholder="Prayer notification emails are available."></textarea></div></div><div class="status-editor"><h3>Admin Dashboard</h3><div class="setting-row"><label>Status</label><select id="adminStatus"><option value="online">Online</option><option value="limited">Limited</option><option value="maintenance">Maintenance</option><option value="offline">Offline</option></select></div><div class="setting-row"><label>Message</label><textarea id="adminMessage" rows="3" placeholder="Admin tools are available."></textarea></div></div></div><div class="setting-row"><label>General Status Message</label><textarea id="statusMessage" rows="3" placeholder="Optional public general status message..."></textarea></div></div><div class="card admin-card" style="margin-top:18px"><h2>Homepage Content</h2><div class="setting-row"><label>Daily Scripture</label><textarea id="dailyVerse" rows="4" placeholder="Come to Me, all who are weary and burdened..."></textarea></div><div class="setting-row"><label>Daily Scripture Reference</label><input id="dailyVerseReference" placeholder="Matthew 11:28"></div><div class="setting-row"><label>Homepage Announcement</label><textarea id="homepageAnnouncement" rows="4" placeholder="Optional announcement..."></textarea></div><button class="btn btn-primary" id="saveSettingsBtn">Save Settings</button><p class="small" id="settingsNotice"></p></div></section></section></main><script src="./nav.js"></script><script type="module" src="./admin-nav.js"></script><script type="module" src="./admin-settings.js"></script></body></html>
