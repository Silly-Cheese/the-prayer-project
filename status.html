<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Site Status | The Prayer Project</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./theme.css"><style>.hero{padding:86px 0 34px}.status-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:24px 0 78px}.status-card{padding:28px}.status-card h2{margin:12px 0}.status-card p{color:var(--muted);line-height:1.8}.pill{display:inline-flex;padding:8px 11px;border-radius:999px;background:rgba(216,195,165,.08);border:1px solid rgba(216,195,165,.18);color:var(--warm2);font-size:12px;font-weight:900;text-transform:uppercase}.pill.online{background:rgba(159,242,179,.12);border-color:rgba(159,242,179,.24);color:var(--green)}.pill.limited{background:rgba(255,242,207,.12);border-color:rgba(255,242,207,.24);color:#fff2cf}.pill.maintenance,.pill.offline{background:rgba(255,211,211,.1);border-color:rgba(255,211,211,.22);color:var(--danger)}.updated{margin-top:16px;color:var(--soft);font-size:12px;font-weight:800}@media(max-width:900px){.status-grid{grid-template-columns:1fr}.hero{padding-top:58px}}</style></head><body><nav class="nav"><div class="shell nav-inner"><a class="brand" href="index.html"><div class="brand-mark">✦</div><div class="brand-title">The Prayer Project<span>Site Status</span></div></a><div class="nav-links"></div></div></nav><main class="shell"><section class="hero"><div class="eyebrow">Site Status</div><h1>Current system status.</h1><p class="lead" id="generalStatus">This page shows the current public status of each part of The Prayer Project.</p></section><section class="status-grid" id="statusGrid"><div class="empty">Loading site status...</div></section></main><footer><div class="shell">The Prayer Project exists to encourage, comfort, and remind people that they are not forgotten.</div></footer><script src="./nav.js"></script><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyAaaABQB1T_SaZ6TARafIXjJ6Zk-upjLO0",authDomain:"prayer-projec.firebaseapp.com",projectId:"prayer-projec",storageBucket:"prayer-projec.firebasestorage.app",messagingSenderId:"47966669764",appId:"1:47966669764:web:b875d2ea5bf75e3b7b3291"};const app=initializeApp(firebaseConfig),db=getFirestore(app),grid=document.getElementById('statusGrid'),general=document.getElementById('generalStatus');const defaults={submissions:{label:'Prayer Submissions',status:'online',message:'Online prayer request submissions are currently open.'},wall:{label:'Prayer Wall',status:'online',message:'The public prayer wall is loading approved requests.'},email:{label:'Email Service',status:'online',message:'Prayer notification emails are available.'},admin:{label:'Admin Dashboard',status:'online',message:'Admin tools are available.'}};try{const snap=await getDoc(doc(db,'settings','site'));const data=snap.exists()?snap.data():{};const cards={...defaults,...(data.statusCards||{})};if(data.submissionsOpen===false&&!data.statusCards?.submissions)cards.submissions={label:'Prayer Submissions',status:'offline',message:'Online prayer request submissions are currently closed.'};general.textContent=data.statusMessage||'This page shows the current public status of each part of The Prayer Project.';grid.innerHTML=Object.values(cards).map(c=>`<article class="card status-card"><span class="pill ${esc(c.status||'online')}">${label(c.status)}</span><h2>${esc(c.label)}</h2><p>${esc(c.message||'No status message has been posted.')}</p>${data.lastSettingsUpdate?`<div class="updated">Last updated: ${esc(data.lastSettingsUpdate)}</div>`:''}</article>`).join('')}catch(e){console.error(e);grid.innerHTML='<div class="empty">Status could not be loaded. Check Firestore rules.</div>'}function label(s){return String(s||'online').replace(/-/g,' ')}function esc(t=''){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}</script></body></html>
